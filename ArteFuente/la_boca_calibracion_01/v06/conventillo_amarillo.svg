<path fill="#3879cf" d="M7 9h3v8H7zm7-4h3v12h-3zm8 0h3v12h-3zm8 0h3v12h-3zm19 0h3v12h-3zm8 0h3v12h-3zm7 4h2v8h-2z"/>
<path fill="#173e7a" d="M11 5h2v12h-2zm8 0h2v12h-2zm8 0h2v12h-2zm8 0h2v12h-2zm12 0h2v12h-2zm8 0h2v12h-2zm8 1h2v11h-2z"/>
<path fill="#5796df" d="M12 4h2v13h-2zm8 1h1v12h-1zm8 0h1v12h-1zm20 0h1v12h-1zm8 0h1v12h-1z"/>
