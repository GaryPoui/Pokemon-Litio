<path fill="#142845" d="M34 2h12v17H34z"/>
<path fill="#2f69ad" d="M36 3h8v14h-8z"/>
<path fill="#3c82d0" d="M38 3h3v14h-3z"/>
<path fill="#8ab7e2" d="M36 3h1v14h-1z"/>
