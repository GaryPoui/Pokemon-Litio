<path fill="#9a7136" d="M4 19h59v3H4zm0 21h59v3H4z"/><path fill="#ffe17b" d="M4 19h59v1H4zm0 21h59v1H4z"/>
<!-- ventanas altas, marcos y vidrios -->
<g><path fill="#713f3e" d="M8 24h11v11H8zm18 0h11v11H26zm18 0h11v11H44z"/><path fill="#d77155" d="M9 25h9v9H9zm18 0h9v9h-9zm18 0h9v9h-9z"/><path fill="#263b54" d="M10 26h7v7h-7zm18 0h7v7h-7zm18 0h7v7h-7z"/><path fill="#72c1cb" d="M11 27h2v2h-2zm3 0h2v2h-2zm-3 3h2v2h-2zm3 0h2v2h-2zm15-3h2v2h-2zm3 0h2v2h-2zm-3 3h2v2h-2zm3 0h2v2h-2zm15-3h2v2h-2zm3 0h2v2h-2zm-3 3h2v2h-2zm3 0h2v2h-2z"/><path fill="#f0bd62" d="M13 26h1v7h-1zm-3 3h7v1h-7zm18 0h7v1h-7zm18 0h7v1h-7z"/></g>
