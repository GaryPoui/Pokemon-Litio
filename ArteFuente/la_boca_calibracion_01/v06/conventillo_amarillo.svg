<path fill="#5d7182" d="M1 61h63v3H1z"/><path fill="#d5d8ce" d="M1 61h63v1H1z"/>
</g>
<g id="techo">
<!-- Techo detrás de la fachada: volumen frontal simétrico y profundidad vertical. -->
<path fill="#172b4c" d="M3 19V8l7-6h51l7 6v11H3z"/>
<path fill="#214c91" d="M5 17V9l6-5h49l6 5v8H5z"/>
