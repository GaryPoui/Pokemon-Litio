<path fill="#172b4c" d="M3 17h65v7H3z"/>
<path fill="#5094e8" d="M4 17h63v2H4z"/>
<path fill="#234d89" d="M3 21h65v3H3z"/>
<path fill="#a7cae8" d="M5 17h61v1H5z"/>
