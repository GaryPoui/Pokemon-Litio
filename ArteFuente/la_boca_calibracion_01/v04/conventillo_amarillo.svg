<path fill="#27374d" d="M61 34h4v3h-4zm3 3h4v3h-4zm3 3h4v3h-4zm3 3h4v3h-4zm3 3h4v3h-4zm1 3h3v8h-3z"/><path fill="#4c91d7" d="M62 35h3v1h-3zm3 3h3v1h-3zm3 3h3v1h-3zm3 3h3v1h-3zm3 3h3v1h-3zm0 4h2v5h-2z"/><path fill="#316bc0" d="M62 36h3v1h-3zm3 3h3v1h-3zm3 3h3v1h-3zm3 3h3v1h-3zm3 3h3v1h-3z"/>
<path fill="#5d7182" d="M1 61h63v3H1z"/><path fill="#d5d8ce" d="M1 61h63v1H1z"/>
</g>
<g id="techo">
<!-- Cumbrera diagonal desde el frente hacia el fondo: dos aguas, sin remate piramidal. -->
<path fill="#172b4c" d="M3 19 37 18 50 3 78 9 66 22 3 23z"/>
<!-- Faldón izquierdo: desciende desde la cumbrera hacia el frente -->
<path fill="#234d89" d="M4 18 37 17 50 4 14 5 3 13z"/>
<path fill="#2f6bc4" d="m5 17 9-10 3 0-10 11zm9 0 10-11h3L17 17zm10 0L35 6h3L27 17zm10 0L47 5h3L37 17z"/>
<path fill="#183d76" d="m9 18 10-11 1 1-10 10zm10 0L30 7l1 1-11 10zm10 0L40 7l1 1-11 10z"/>
<path fill="#75a7df" d="m8 15 8-8 1 1-8 8zm10 0 8-8 1 1-8 8zm10 0 8-8 1 1-8 8z"/>
<!-- Faldón derecho, continúa la profundidad hasta el muro lateral -->
<path fill="#2f69ad" d="M37 17 50 4 77 10 65 21z"/>
<path fill="#3c82d0" d="m39 16 11-11 3 1-12 11zm8 0L59 8l3 1-12 8zm9 1 11-7 3 1-12 7zm8 1 10-6 2 1-11 6z"/>
<path fill="#1c477f" d="m43 16 12-11 1 1-12 10zm9 1 12-8 1 1-12 8zm9 1 11-7 1 1-11 7z"/>
<path fill="#8ab7e2" d="m47 14 10-9 1 1-10 9zm9 1 10-6 1 1-10 6zm9 1 8-5 1 1-8 5z"/>
<!-- Cumbrera diagonal hacia atrás, como un techo a dos aguas visto desde arriba -->
<path fill="#142845" d="m35 19 3-2L50 3l3 1-13 15-3 2z"/><path fill="#9fc5e7" d="m38 16 11-12 1 1-11 12z"/>
<!-- Alero frontal fino: deja despejada la fachada superior -->
<path fill="#172b4c" d="M3 18 37 17 66 20v4l-29-3-34 2z"/>
<path fill="#5094e8" d="M3 18 37 17 66 20v1l-29-2-34 3z"/>
<path fill="#234d89" d="M4 21 37 19l29 3v2l-29-3-33 2z"/>
<path fill="#a7cae8" d="m5 18 31-2 1 1-32 3zm34-1 25 3v1l-25-3z"/>
<!-- Remiendo de chapa roja -->
<path fill="#773d3c" d="M13 8h4v6h-4z"/><path fill="#e07856" d="M13 8h3v1h-2v4h-1z"/>
</g></svg>