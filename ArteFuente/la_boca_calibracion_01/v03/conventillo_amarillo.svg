<path fill="#27374d" d="M61 34h4v3h-4zm3 3h4v3h-4zm3 3h4v3h-4zm3 3h4v3h-4zm3 3h4v3h-4zm1 3h3v8h-3z"/><path fill="#4c91d7" d="M62 35h3v1h-3zm3 3h3v1h-3zm3 3h3v1h-3zm3 3h3v1h-3zm3 3h3v1h-3zm0 4h2v5h-2z"/><path fill="#316bc0" d="M62 36h3v1h-3zm3 3h3v1h-3zm3 3h3v1h-3zm3 3h3v1h-3zm3 3h3v1h-3z"/>
<path fill="#5d7182" d="M1 61h63v3H1z"/><path fill="#d5d8ce" d="M1 61h63v1H1z"/>
</g>
<g id="techo">
<!-- Techo a dos aguas: la cumbrera corre del frente hacia el fondo. -->
<path fill="#172b4c" d="M39 1 77 17l2 4-37-6L5 25 3 21 5 18z"/>
<!-- Faldón izquierdo, más oscuro y largo -->
<path fill="#234d89" d="M39 3 41 15 6 23 6 19z"/>
<path fill="#2f6bc4" d="M35 4 37 16l-4 1-2-11zM28 7l2 10-4 1-2-10zM21 10l2 9-4 1-2-8zM14 13l2 8-4 1-2-7z"/>
<path fill="#183d76" d="M32 5 34 16l-1 1-2-11zM25 8l2 10h-1L24 9zM18 11l2 9h-1l-2-8z"/>
<path fill="#6c9ed2" d="M38 4 39 14 37 15 36 5zM11 17l1 5-2 1-1-5z"/>
