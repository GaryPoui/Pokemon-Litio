<path fill="#3274bb" d="M40 3 75 17 77 19 42 15z"/>
<path fill="#5094e8" d="M45 5l3 1 4 10-3-1zM53 8l3 1 4 9-3-1zM61 11l3 1 5 8-3-1zM69 14l3 1 3 5-3-1z"/>
<path fill="#234d89" d="M49 7l2 1 4 9-2-1zM58 10l2 1 4 9-2-1zM67 13l2 1 4 7-2-1z"/>
<path fill="#8ab7e2" d="M42 4l1 1 4 10-1-1zM72 16l2 1 2 3-2-1z"/>
<!-- Cumbrera larga y remates laterales -->
<path fill="#142845" d="M38 1h3l3 14-3 1z"/>
<path fill="#6f9fda" d="M39 2h1l3 12h-1z"/>
<!-- Alero grueso que separa el techo de la fachada -->
<path fill="#172b4c" d="M5 20 42 14l37 6v4l-37-7L5 27z"/>
<path fill="#5094e8" d="M5 20 42 14l37 6v2l-37-6L5 25z"/>
<path fill="#234d89" d="M5 25 42 18l37 5v2l-37-5L5 27z"/>
<path fill="#9fc5e7" d="M7 20 41 15v1L7 22zm39-4 31 5v1l-31-5z"/>
<!-- Remiendo de chapa rojiza, detalle propio del conventillo -->
<path fill="#773d3c" d="M13 14h5v6h-5z"/><path fill="#e07856" d="M13 14h4v1h-3v4h-1z"/>
</g></svg>